<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="Admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="profile">

            <div class="avatar">
                AV
            </div>

            <h3>Admin User</h3>
            <span>Administrator</span>

        </div>

        <ul class="menu">

            <li class="active">
                <i class="fas fa-chart-line"></i>
                Overview
            </li>

            <li>
                <i class="fas fa-file-alt"></i>
                Complaints
            </li>

            <li>
                <i class="fas fa-users"></i>
                Users
            </li>

            <li>
                <i class="fas fa-chart-bar"></i>
                Reports
            </li>

            <li id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </li>

        </ul>

    </aside>

    <!-- Main Content -->
    <main class="content">

        <h1>Admin Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h2>248</h2>
                <p>Total Complaints</p>
            </div>

            <div class="card">
                <h2>59</h2>
                <p>Pending</p>
            </div>

            <div class="card">
                <h2>189</h2>
                <p>Resolved</p>
            </div>

            <div class="card">
                <h2>1,420</h2>
                <p>Students</p>
            </div>

        </div>

        <div class="table-container">

            <h2>Recent Complaints</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Category</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>CMP001</td>
                        <td>John Doe</td>
                        <td>Academic</td>
                        <td>
                            <span class="pending">
                                Pending
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td>CMP002</td>
                        <td>Mary James</td>
                        <td>Hostel</td>
                        <td>
                            <span class="resolved">
                                Resolved
                            </span>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="Amin.js"></script>

</body>
</html>
